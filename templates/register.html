{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width: 440px; margin: 0 auto;">
  <h2>Criar nova conta</h2>
  <form method="POST">
    <label>Nome Completo</label>
    <input type="text" name="nome" required>

    <label>Email</label>
    <input type="email" name="email" required>
    
    <label>Senha</label>
    <input type="password" name="senha" required>

    <hr style="border: none; border-top: 1px dashed #D4D4CF; margin: 20px 0;">
    <p style="font-size: 13px; color: gray; margin-bottom: 12px;">Esses dados são opcionais aqui, mas você pode preenchê-los agora ou depois em "Meu Perfil".</p>

    <div style="display: flex; gap: 12px;">
      <div style="flex: 1;">
        <label>Idade</label>
        <input type="number" name="idade" min="10" max="100">
      </div>
      <div style="flex: 1;">
        <label>Sexo</label>
        <select name="sexo">
          <option value="">Selecione</option>
          {% for op in opcoes_sexo %}
            <option value="{{ op }}">{{ op }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="display: flex; gap: 12px;">
      <div style="flex: 1;">
        <label>Altura (m)</label>
        <input type="number" name="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.75">
      </div>
      <div style="flex: 1;">
        <label>Peso (kg)</label>
        <input type="number" name="peso" step="0.1" min="20" max="300" placeholder="Ex: 70.5">
      </div>
    </div>

    <label>Objetivo</label>
    <select name="objetivo">
      <option value="">Selecione</option>
      {% for op in opcoes_objetivo %}
        <option value="{{ op }}">{{ op }}</option>
      {% endfor %}
    </select>

    <label>Nível de experiência</label>
    <select name="nivel_experiencia">
      <option value="">Selecione</option>
      {% for op in opcoes_nivel %}
        <option value="{{ op }}">{{ op }}</option>
      {% endfor %}
    </select>
    
    <button type="submit" class="btn" style="margin-top: 12px;">Cadastrar</button>
  </form>
  <p style="text-align: center; margin-top: 20px;">
    Já tem conta? <a href="/login">Entrar</a>
  </p>
</div>
{% endblock %}
