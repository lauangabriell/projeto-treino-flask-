<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Treino em Casa - Calistenia & Pilates</title>
<style>
  :root {
    --green-50:  #E8F8F0; --green-100: #C3EDDA; --green-500: #22A96A; --green-600: #1A8A55;
    --green-800: #0D5234; --gray-50:   #F5F5F3; --gray-100:  #EAEAE7; --gray-200:  #D4D4CF;
    --gray-400:  #9A9A93; --gray-600:  #5C5C57; --gray-800:  #1E1E1A;
    --bg: #F5F5F3; --surface: #FFFFFF;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--gray-800); padding: 40px 20px; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--gray-100); box-shadow: 0 4px 24px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 24px; height: fit-content; }
  h2 { font-size: 20px; font-weight: 600; color: var(--gray-800); }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 14px; font-weight: 500; color: var(--gray-600); }
  select, input { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--gray-200); background: var(--bg); color: var(--gray-800); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s; }
  select:focus, input:focus { border-color: var(--green-500); }
  .btn { background: var(--green-500); color: white; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-align: center; }
  .btn:hover { background: var(--green-600); }
  .btn-secondary { background: var(--gray-100); color: var(--gray-800); margin-top: 12px; }
  .btn-secondary:hover { background: var(--gray-200); }
  .treino-output { background: var(--surface); border: 1px solid var(--gray-100); border-radius: var(--radius-lg); padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.02); }
  .badge { background: var(--green-50: #E8F8F0); color: var(--green-800); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
  .badge.gray { background: var(--gray-50); color: var(--gray-600); }
  .ex-item { display: flex; gap: 16px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--gray-50); }
  .ex-num { background: var(--green-50); color: var(--green-600); font-weight: 700; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .ex-name { font-weight: 600; font-size: 15px; color: var(--gray-800); }
  .ex-detail { font-size: 13px; color: var(--gray-400); margin-top: 2px; }
  .historico-section { margin-top: 24px; border-top: 2px dashed var(--gray-100); padding-top: 24px; }
</style>
</head>
<body>

<div class="container">
  <div class="panel">
    <div>
      <h2>Perfil Ativo (Banco Neon)</h2>
      <p style="font-size: 14px; color: var(--green-600); font-weight: bold; margin-top: 4px;">👤 Lauan Gabriel (ID: #1)</p>
    </div>
    
    <h2>Personalize seu Treino</h2>
    <div class="form-group">
      <label>Modalidade Alvo</label>
      <select id="goal">
        <option value="calistenia">Calistenia (Força e Definição)</option>
        <option value="pilates">Pilates (Core e Flexibilidade)</option>
        <option value="cardio">Cardio HIIT (Resistência)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Nível de Experiência</label>
      <select id="level">
        <option value="Iniciante">Iniciante</option>
        <option value="Intermediário">Intermediário</option>
        <option value="Avançado">Avançado</option>
      </select>
    </div>

    <div class="form-group">
      <label>Duração Estimada (Minutos)</label>
      <input type="number" id="duration" value="30" min="15" max="90">
    </div>

    <button class="btn" onclick="gerarTreino()">Gerar Rotina Dinâmica</button>
    
    <div class="historico-section">
      <h2>Meus Treinos Salvos (Histórico)</h2>
      <div id="meus-treinos-salvos" style="margin-top: 12px; max-height: 250px; overflow-y: auto;">
        <p style="color: var(--gray-400); font-size: 14px;">Nenhum treino carregado.</p>
      </div>
    </div>
  </div>

  <div class="treino-output" id="treino-resultado">
    <div style="text-align: center; color: var(--gray-400); padding-top: 60px;">
      <p>Configure as opções ao lado e clique em <strong>Gerar Rotina Dinâmica</strong>.</p>
    </div>
  </div>
</div>

<script>
  let treinoAtual = null;

  // Gerador dinâmico estendido com mais opções de exercícios
  function gerarTreino() {
    const goal = document.getElementById('goal').value;
    const level = document.getElementById('level').value;
    const duration = document.getElementById('duration').value;

    let exercicios = [];
    if (goal === 'calistenia') {
      exercicios = level === 'Iniciante' ? ['Flexões de Joelho', 'Agachamentos Livres', 'Prancha Abdominal', 'Remada Invertida'] : 
                   level === 'Intermediário' ? ['Flexões Tradicionais', 'Pistol Squat Adaptado', 'Barra Fixa', 'Abdominal Infra'] :
                   ['Flexões Batendo Palma', 'Muscle-Up na Barra', 'Agachamento com Salto', 'Dragon Flag'];
    } else if (goal === 'pilates') {
      exercicios = level === 'Iniciante' ? ['The Hundred (Modificado)', 'The Roll Up', 'Single Leg Stretch', 'Spine Stretch'] :
                   ['The Hundred Clássico', 'Criss Cross Pilates', 'Swan Dive', 'Teaser Progressivo'];
    } else {
      exercicios = ['Burpees', 'Polichinelos Intensos', 'Corrida Estática', 'Escalador (Mountain Climbers)', 'Agachamento Isométrico'];
    }

    treinoAtual = { nivel: level, objetivo: goal, duracao: duration, exercicios: exercicios };

    const resultDiv = document.getElementById('treino-resultado');
    resultDiv.innerHTML = `
      <div style="margin-bottom: 20px;">
        <span class="badge">${level}</span>
        <span class="badge gray">${duration} min</span>
        <h2 style="margin-top: 12px;">Sessão de ${goal.toUpperCase()}</h2>
      </div>
      <div style="margin-bottom: 24px;">
        ${exercicios.map((ex, idx) => `
          <div class="ex-item">
            <div class="ex-num">${idx + 1}</div>
            <div>
              <div class="ex-name">${ex}</div>
              <div class="ex-detail">Executar com cadência controlada e foco muscular.</div>
            </div>
          </div>
        `).join('')}
      </div>
      <button class="btn" style="width:100%" onclick="salvarTreinoNoBanco()">💾 Salvar Treino no meu Perfil</button>
    `;
  }

  // Envia os dados para a API Flask salvar no Neon
  function salvarTreinoNoBanco() {
    if (!treinoAtual) return;

    fetch('/api/treino/salvar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(treinoAtual)
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      carregarTreinosSalvos(); // Atualiza a lista de históricos instantaneamente
    })
    .catch(err => console.error("Erro ao salvar:", err));
  }

  // Puxa do banco Neon tudo o que o usuário já fez e salvou
  function carregarTreinosSalvos() {
    fetch('/api/treinos/salvos')
    .then(res => res.json())
    .then(treinos => {
      const box = document.getElementById('meus-treinos-salvos');
      if (treinos.length === 0) {
        box.innerHTML = '<p style="color: var(--gray-400); font-size:14px;">Nenhum treino salvo ainda.</p>';
        return;
      }
      box.innerHTML = treinos.map(t => `
        <div style="background: var(--gray-50); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 8px; border: 1px solid var(--gray-100);">
          <strong style="font-size:14px; color: var(--green-600)">💪 Rotina #${t.id_treino} - ${t.objetivo}</strong>
          <div style="font-size:11px; color: var(--gray-600); margin: 2px 0;">Nível: ${t.nivel} | Duração: ${t.duracao} min</div>
          <div style="font-size:12px; color: var(--gray-800); font-style: italic; margin-top: 4px;">⚡ ${t.exercicios.join(', ')}</div>
        </div>
      `).join('');
    });
  }

  // Carrega o histórico assim que a página abre
  document.addEventListener("DOMContentLoaded", carregarTreinosSalvos);
</script>
</body>
</html>
